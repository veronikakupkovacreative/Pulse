name: PULSE Studio regression QA
on:
  push:
    branches:
      - feature/pulse-editor-workspace-3
      - feature/pulse-eq-waveform-ui-qa
      - feature/pulse-ai-studio-4-workflow
      - feature/pulse-character-export-brand-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package final source and built PULSE Studio
        uses: actions/upload-artifact@v4
        with:
          name: PULSE_STUDIO_FINAL_2026-10-30
          retention-days: 30
          if-no-files-found: error
          path: |
            source/
            public/
            backend/
            tests/
            scripts/
            docs/
            index.html
            package.json
            package-lock.json
            server.py
            Dockerfile
            railway.json
            vercel.json
            README.md
            .env.example
      - name: Install Chromium test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Real browser Equalizer QA
        run: node tests/equalizer-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-equalizer-qa-screenshots
          path: .artifacts/equalizer-*.png
          if-no-files-found: ignore
