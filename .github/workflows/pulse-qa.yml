name: PULSE Studio regression QA
on:
  push:
    branches:
      - feature/pulse-editor-workspace-3
      - feature/pulse-eq-waveform-ui-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
