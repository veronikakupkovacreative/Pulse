name: Pulse validation
on:
  push:
    branches:
      - feature/pulse-audio-stability-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regression tests
        run: npm test
      - name: Build standalone application
        run: npm run build
      - name: Verify output
        run: test -s public/index.html
